<footer class="site-footer">
  <span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span>
  <div class="footer-links">
    {% if site.email != '' %}<a href="mailto:{{ site.email | escape }}">Email</a>{% endif %}
    {% if site.github_url != '' %}<a href="{{ site.github_url | escape }}">GitHub</a>{% endif %}
    {% if site.linkedin_url != '' %}<a href="{{ site.linkedin_url | escape }}">LinkedIn</a>{% endif %}
  </div>
</footer>
